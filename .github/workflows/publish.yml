name: Publish reel
on:
  schedule:
    - cron: '7 * * * *'   # hourly check; posts only what is due (GitHub delays scheduled runs)
  workflow_dispatch:
    inputs:
      id:
        description: 'queue id to publish now (blank = whatever is due)'
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: ig-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish due reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE_ID: ${{ github.event.inputs.id }}
        run: |
          if [ -n "$FORCE_ID" ]; then python scripts/ig.py publish --id "$FORCE_ID"; else python scripts/ig.py publish; fi
      - name: Archive posted videos to Drive, then drop them from the store and the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/store.py archive || true
          if ! git diff --quiet state/posted.json; then gh workflow run pages.yml -R "${{ github.repository }}" --ref main || true; fi
      - name: Save state
        if: always()
        run: |
          git config user.name "koru-bot"; git config user.email "koru-bot@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "state: publish $(date -u +%FT%TZ)" && git pull --rebase && git push)
