name: Dry run (upload test, no publish)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/ig.py dryrun
      - if: always()
        run: |
          git config user.name "koru-bot"; git config user.email "koru-bot@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "state: dryrun" && git pull --rebase && git push)
