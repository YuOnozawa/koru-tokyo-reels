name: Check / refresh token
on:
  push:
    branches: [main]
    paths: ['.github/workflows/token.yml', 'scripts/ig.py']
  schedule:
    - cron: '23 1 1,15 * *'   # 1st and 15th
  workflow_dispatch:
permissions:
  contents: write
jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check account
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/ig.py check
      - name: Refresh
        if: github.event_name != 'push'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/ig.py refresh
      - name: Save
        if: always()
        run: |
          git config user.name "koru-bot"; git config user.email "koru-bot@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "state: token $(date -u +%F)" && git pull --rebase && git push)
