name: Fetch insights
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 h (03/09/15/21:17 JST) so each post is read at the same age
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-insights
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/ig.py insights
      - name: Scoreboard
        run: python scripts/scoreboard.py || true
      - name: PDCA dataset
        run: python tools/pdca/dataset.py || true
      - name: Save
        run: |
          git config user.name "koru-bot"; git config user.email "koru-bot@users.noreply.github.com"
          git add state docs/experiments/scoreboard.md docs/pdca
          git diff --cached --quiet || (git commit -m "state: insights $(date -u +%F)" && git pull --rebase && git push)
