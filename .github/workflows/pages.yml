name: Host videos (GitHub Pages)
# rev: 2026-10-12 token+pages activation
on:
  push:
    branches: [main]
    paths: ['videos/**', 'site/**', 'state/posted.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        # Only unposted videos are hosted (Instagram keeps its own copy after publishing), so the site stays far below the 1 GB Pages limit.
        run: |
          mkdir -p _site/videos
          python3 -c "import json,os,shutil; done={p['id'] for p in json.load(open('state/posted.json'))}; [shutil.copy('videos/'+f,'_site/videos/') for f in os.listdir('videos') if f.endswith('.mp4') and f[:-4] not in done]"
          cp -r site/. _site/ && printf '<!doctype html><meta http-equiv="refresh" content="0;url=list/"><title>Yu & Koru</title>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
