name: Host videos (GitHub Pages)
# rev: 2026-10-12 token+pages activation
on:
  push:
    branches: [main]
    paths: ['videos/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: mkdir -p _site && cp -r videos _site/ && cp -r site/. _site/ && printf '<!doctype html><meta http-equiv="refresh" content="0;url=list/"><title>Yu & Koru</title>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
