name: Host videos (GitHub Pages)
# rev: 2026-10-12 token+pages activation
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/store.py', '.github/workflows/pages.yml', 'tools/build_issues.py', 'queue.json']
  schedule:
    - cron: '3 15 * * *'   # 00:03 JST: refresh the home page's latest-issues strip for the new day
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        # Only unposted videos are hosted (Instagram keeps its own copy after publishing). Videos come from the
        # 'video-store' release, so they never bloat the git repository.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/build_issues.py
          python3 scripts/store.py site _site/videos
          cp -r site/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
