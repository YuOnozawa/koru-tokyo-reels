name: Fetch stock photos (CC0)
on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'queries separated by |'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - env:
          Q: ${{ github.event.inputs.queries }}
        run: |
          IFS='|' read -ra ARR <<< "$Q"
          python tools/fetch_stock.py "${ARR[@]}"
      - run: |
          git config user.name "koru-bot"; git config user.email "koru-bot@users.noreply.github.com"
          git add stock
          git diff --cached --quiet || (git commit -m "stock: fetch" && git pull --rebase && git push)
